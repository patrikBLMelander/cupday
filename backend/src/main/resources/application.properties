spring.application.name=cup-backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cup}
spring.datasource.username=${DB_USER:cup}
spring.datasource.password=${DB_PASSWORD:cup}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.locations=classpath:db/migration

server.port=${PORT:8080}
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

cup.auth.jwt.secret=${JWT_SECRET:please-rotate-me-256-bits-is-32-bytes-yes}
cup.auth.jwt.ttl-seconds=${JWT_TTL_SECONDS:86400}
cup.auth.admin.email=${CUP_ADMIN_EMAIL:}
cup.auth.admin.password-hash=${CUP_ADMIN_PASSWORD_HASH:}

cup.cors.allowed-origins=${CUP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

cup.practice-matches.rate-limit.max-posts=${PRACTICE_MATCH_MAX_POSTS:20}
cup.practice-matches.rate-limit.window-minutes=${PRACTICE_MATCH_WINDOW_MINUTES:10}

cup.practice-matches.retention-days=${PRACTICE_MATCH_RETENTION_DAYS:30}

# Public site (frontend) origin, used in link previews.
cup.public.site-url=${CUP_SITE_URL:http://localhost:5173}

# Transactional email via Resend. Without RESEND_API_KEY mail is only written to the log.
cup.mail.resend-api-key=${RESEND_API_KEY:}
cup.mail.from=${CUP_MAIL_FROM:Din Cup <noreply@dincup.se>}
